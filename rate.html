    <h1 align="center">Share your experience-!</h1>
    <form>
        <label>Your Name</label><input placeholder="Enter your name">
        <label>Email Address</label><input placeholder="Enter your email">
        <label>Food</label>
        <select>
            <option>Choose your food</option>
            <option>Black Coffee</option>
            <option>Hamburger</option>
            <option>French Fries</option>
            <option>Diet Coke</option>
            <option>Maccaroni Pizza</option>
            <option>Sandwich</option>
            <option>Garlic Bread</option>
            <option>Cheese Garlic Bread</option>
            <option>Pasta</option>
            <option>Classic Lemonade</option>
            <option>Cheese Burger</option>
            <option>Bread Toast</option>
        </select>
        <label>Rating</label>
        <select>
            <option>Choose your rating</option>
            <option>5 Star</option>
            <option>4 Stars</option>
            <option>3 Stars</option>
            <option>2 Stars</option>
            <option>1 Star</option>
        </select>
        <label>Your Review</label><textarea placeholder="Write your experience"></textarea>
        <button>Submit Review</button>
        <button>Clear Form</button>
    </form>
</body>
